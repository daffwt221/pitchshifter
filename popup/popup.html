<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>PitchShifter</title>
  </head>
  <body>
    <header class="app-header">
      <span class="brand">
        <span class="brand-dot"></span>
        PitchShifter
      </span>
      <button id="reset" class="reset" title="Reset to 0">&#x21BB;</button>
    </header>

    <section class="panel">
      <div class="panel-top">
        <span class="label">Pitch</span>
        <span class="unit">semitones</span>
        <span class="value" id="pitchValue">0</span>
      </div>
      <div class="panel-control">
        <button class="step" id="pitchMinus" aria-label="Decrease pitch">&minus;</button>
        <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0" />
        <button class="step" id="pitchPlus" aria-label="Increase pitch">+</button>
      </div>
    </section>

    <section class="panel">
      <div class="panel-top">
        <span class="label">Microtones</span>
        <span class="unit">fine</span>
        <span class="value" id="microValue">0.00</span>
      </div>
      <div class="panel-control">
        <button class="step" id="microMinus" aria-label="Decrease microtones">&minus;</button>
        <input type="range" id="microSlider" min="-1" max="1" step="0.01" value="0" />
        <button class="step" id="microPlus" aria-label="Increase microtones">+</button>
      </div>
    </section>

    <footer class="status">
      <span id="status" class="status-text">&hellip;</span>
    </footer>

    <script src="popup.js"></script>
  </body>
</html>
