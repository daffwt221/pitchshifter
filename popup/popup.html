<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>PitchShifter</title>
  </head>
  <body>
    <div class="titlebar">PitchShifter</div>

    <div class="group">
      <div class="ghead">
        <span class="glabel">Pitch</span>
        <span class="gunit">semitones</span>
        <span class="gright">
          <span class="val" id="pitchValue">0</span>
          <button class="reset" id="pitchReset" title="Reset pitch">&#x21BB;</button>
        </span>
      </div>
      <div class="row">
        <button class="btn" id="pitchMinus" aria-label="Decrease pitch">&minus;</button>
        <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0" />
        <button class="btn" id="pitchPlus" aria-label="Increase pitch">+</button>
      </div>
    </div>

    <div class="group">
      <div class="ghead">
        <span class="glabel">Microtones</span>
        <span class="gunit">fine</span>
        <span class="gright">
          <span class="val" id="microValue">0.00</span>
          <button class="reset" id="microReset" title="Reset microtones">&#x21BB;</button>
        </span>
      </div>
      <div class="row">
        <button class="btn" id="microMinus" aria-label="Decrease microtones">&minus;</button>
        <input type="range" id="microSlider" min="-1" max="1" step="0.01" value="0" />
        <button class="btn" id="microPlus" aria-label="Increase microtones">+</button>
      </div>
    </div>

    <div class="group">
      <div class="ghead">
        <span class="glabel">Speed</span>
        <span class="gunit">tempo</span>
        <span class="gright">
          <span class="val" id="speedValue">100%</span>
          <button class="reset" id="speedReset" title="Reset speed">&#x21BB;</button>
        </span>
      </div>
      <div class="row">
        <button class="btn" id="speedMinus" aria-label="Decrease speed">&minus;</button>
        <input type="range" id="speedSlider" min="0.25" max="2" step="0.01" value="1" />
        <button class="btn" id="speedPlus" aria-label="Increase speed">+</button>
      </div>
    </div>

    <div class="status"><span id="status" class="status-text">&hellip;</span></div>

    <script src="popup.js"></script>
  </body>
</html>
