<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="popup.css" />
    <title>PitchShifter</title>
  </head>
  <body>
    <div class="titlebar">
      <img class="logo" src="../icons/icon.svg" alt="" width="18" height="18" />
      <span class="title-text">PitchShifter</span>
      <button
        id="enabledToggle"
        class="power-btn"
        type="button"
        title="Enable on this tab"
        aria-label="Enable on this tab"
        aria-pressed="false"
      >
        Off
      </button>
      <button
        id="themeToggle"
        class="theme-btn"
        type="button"
        title="Toggle theme"
        aria-label="Toggle theme"
      >
        <svg
          class="icon-moon"
          viewBox="0 0 24 24"
          width="15"
          height="15"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z" />
        </svg>
        <svg
          class="icon-sun"
          viewBox="0 0 24 24"
          width="15"
          height="15"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path
            d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
          />
        </svg>
      </button>
    </div>

    <div class="tabs" role="tablist" aria-label="PitchShifter controls">
      <button id="mainTab" class="tab-btn active" type="button" role="tab" aria-selected="true" aria-controls="mainPanel">Pitch &amp; Speed</button>
      <button id="reverbTab" class="tab-btn" type="button" role="tab" aria-selected="false" aria-controls="reverbPanel">Reverb</button>
    </div>

    <section id="mainPanel" class="tab-panel active" role="tabpanel" aria-labelledby="mainTab">
    <div class="group">
      <div class="ghead">
        <span class="glabel">Pitch</span>
        <span class="gright">
          <input
            class="val"
            id="pitchValue"
            type="text"
            inputmode="decimal"
            aria-label="Pitch value"
            value="0"
          />
          <button class="reset" id="pitchReset" title="Reset pitch">&#x21BB;</button>
        </span>
      </div>
      <div class="row">
        <button class="btn" id="pitchMinus" aria-label="Decrease pitch">&minus;</button>
        <input type="range" id="pitchSlider" min="-12" max="12" step="1" value="0" />
        <button class="btn" id="pitchPlus" aria-label="Increase pitch">+</button>
      </div>
    </div>

    <div class="group">
      <div class="ghead">
        <span class="glabel">Microtones</span>
        <span class="gright">
          <input
            class="val"
            id="microValue"
            type="text"
            inputmode="decimal"
            aria-label="Microtones value"
            value="0.00"
          />
          <button class="reset" id="microReset" title="Reset microtones">&#x21BB;</button>
        </span>
      </div>
      <div class="row">
        <button class="btn" id="microMinus" aria-label="Decrease microtones">&minus;</button>
        <input type="range" id="microSlider" min="-1" max="1" step="0.01" value="0" />
        <button class="btn" id="microPlus" aria-label="Increase microtones">+</button>
      </div>
    </div>

    <div class="group">
      <div class="ghead">
        <span class="glabel">Speed</span>
        <span class="gright">
          <input
            class="val"
            id="speedValue"
            type="text"
            inputmode="decimal"
            aria-label="Speed value (percent)"
            value="100%"
          />
          <button class="reset" id="speedReset" title="Reset speed">&#x21BB;</button>
        </span>
      </div>
      <div class="row">
        <button class="btn" id="speedMinus" aria-label="Decrease speed">&minus;</button>
        <input type="range" id="speedSlider" min="0.25" max="2" step="0.01" value="1" />
        <button class="btn" id="speedPlus" aria-label="Increase speed">+</button>
      </div>
    </div>

    </section>

    <section id="reverbPanel" class="tab-panel" role="tabpanel" aria-labelledby="reverbTab" hidden>
    <div class="mode-switch" role="group" aria-label="Reverb mode">
      <button id="simpleMode" class="mode-btn active" type="button" aria-pressed="true">Simple</button>
      <button id="advancedMode" class="mode-btn" type="button" aria-pressed="false">Advanced</button>
    </div>

    <div class="group">
      <div class="ghead">
        <span class="glabel">Amount</span>
        <span class="gright">
          <input
            class="val"
            id="reverbValue"
            type="text"
            inputmode="decimal"
            aria-label="Reverb mix (percent)"
            value="0%"
          />
          <button class="reset" id="reverbReset" title="Reset reverb">&#x21BB;</button>
        </span>
      </div>
      <div class="row">
        <button class="btn" id="reverbMinus" aria-label="Decrease reverb">&minus;</button>
        <input type="range" id="reverbSlider" min="0" max="1" step="0.01" value="0" />
        <button class="btn" id="reverbPlus" aria-label="Increase reverb">+</button>
      </div>
    </div>

    <div id="advancedControls" class="advanced-controls" hidden>
      <div class="group">
        <div class="ghead">
          <span class="glabel">Room Size</span>
          <span class="gright">
            <input class="val" id="reverbSizeValue" type="text" inputmode="decimal" aria-label="Reverb room size (percent)" value="100%" />
            <button class="reset" id="reverbSizeReset" title="Reset room size">&#x21BB;</button>
          </span>
        </div>
        <div class="row">
          <button class="btn" id="reverbSizeMinus" aria-label="Decrease room size">&minus;</button>
          <input type="range" id="reverbSizeSlider" min="0.5" max="1.5" step="0.01" value="1" />
          <button class="btn" id="reverbSizePlus" aria-label="Increase room size">+</button>
        </div>
      </div>

      <div class="group">
        <div class="ghead">
          <span class="glabel">Decay</span>
          <span class="gright">
            <input class="val" id="reverbDecayValue" type="text" inputmode="decimal" aria-label="Reverb decay (seconds)" value="2.8 s" />
            <button class="reset" id="reverbDecayReset" title="Reset decay">&#x21BB;</button>
          </span>
        </div>
        <div class="row">
          <button class="btn" id="reverbDecayMinus" aria-label="Decrease decay">&minus;</button>
          <input type="range" id="reverbDecaySlider" min="0.8" max="5" step="0.1" value="2.8" />
          <button class="btn" id="reverbDecayPlus" aria-label="Increase decay">+</button>
        </div>
      </div>

      <div class="group">
        <div class="ghead">
          <span class="glabel">Tone</span>
          <span class="gright">
            <input class="val" id="reverbToneValue" type="text" inputmode="decimal" aria-label="Reverb brightness (percent)" value="55%" />
            <button class="reset" id="reverbToneReset" title="Reset tone">&#x21BB;</button>
          </span>
        </div>
        <div class="row">
          <button class="btn" id="reverbToneMinus" aria-label="Darken reverb">&minus;</button>
          <input type="range" id="reverbToneSlider" min="0" max="1" step="0.01" value="0.55" />
          <button class="btn" id="reverbTonePlus" aria-label="Brighten reverb">+</button>
        </div>
      </div>

      <div class="group">
        <div class="ghead">
          <span class="glabel">Pre-delay</span>
          <span class="gright">
            <input class="val" id="reverbPreDelayValue" type="text" inputmode="decimal" aria-label="Reverb pre-delay (milliseconds)" value="16 ms" />
            <button class="reset" id="reverbPreDelayReset" title="Reset pre-delay">&#x21BB;</button>
          </span>
        </div>
        <div class="row">
          <button class="btn" id="reverbPreDelayMinus" aria-label="Decrease pre-delay">&minus;</button>
          <input type="range" id="reverbPreDelaySlider" min="0" max="0.1" step="0.001" value="0.016" />
          <button class="btn" id="reverbPreDelayPlus" aria-label="Increase pre-delay">+</button>
        </div>
      </div>
    </div>
    </section>

    <div class="status">
      <span id="status" class="status-text">&hellip;</span>
      <a id="donate" class="donate" target="_blank" rel="noopener"
        ><span class="heart">&#9829;</span> Support</a
      >
    </div>

    <script src="popup.js"></script>
  </body>
</html>
